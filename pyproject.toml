[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "structguru"
version = "0.2.0"
description = "A loguru-style ergonomic API for structlog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aleksandr Pavlov", email = "ckidoz@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "structlog>=24.1.0",
    "orjson>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/kidoz/structguru"
Repository = "https://github.com/kidoz/structguru"
Issues = "https://github.com/kidoz/structguru/issues"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.0"]
celery = ["celery>=5.0"]
flask = ["flask>=2.0"]
django = ["django>=4.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
grpc = ["grpcio>=1.50"]
sentry = ["sentry-sdk>=1.0"]
httpx = ["httpx>=0.20"]
requests = ["requests>=2.0"]
all = [
    "structguru[otel,celery,flask,django,sqlalchemy,grpc,sentry,httpx,requests]",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "bench" },
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0.0",
    "pytest-httpserver>=1.0.0",
    "responses>=0.25.0",
]
lint = [
    "mypy>=1.8",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
bench = [
    "pytest-benchmark>=5.2.3",
    "loguru>=0.7.3",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/structguru-py/Cargo.toml"
module-name = "structguru._rust"
python-source = "src"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.*",
    "celery",
    "celery.*",
    "flask",
    "flask.*",
    "sentry_sdk",
    "sentry_sdk.*",
    "grpc",
    "grpc.*",
    "httpx",
    "httpx.*",
    "requests",
    "requests.*",
    "responses",
    "pytest_httpserver",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
