[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "structguru"
version = "1.2.3"
description = "Native structured logging with a loguru-style Python API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aleksandr Pavlov", email = "ckidoz@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kidoz/structguru"
Repository = "https://github.com/kidoz/structguru"
Issues = "https://github.com/kidoz/structguru/issues"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.0"]
celery = ["celery>=5.0"]
flask = ["flask>=2.0"]
django = ["django>=4.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
grpc = ["grpcio>=1.50"]
sentry = ["sentry-sdk>=1.0"]
httpx = ["httpx>=0.20"]
requests = ["requests>=2.0"]
all = [
    "structguru[otel,celery,flask,django,sqlalchemy,grpc,sentry,httpx,requests]",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "bench" },
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.1.5",
    "responses>=0.26.3",
    # structlog + orjson are kept as test-only deps for the golden parity suite
    # (which compares native output against the standard structlog/orjson path).
    "structlog>=26.1.0",
    "orjson>=3.12.0",
    # fastapi drives the full-stack example smoke test (examples/full_stack_fastapi);
    # celery/sqlalchemy/httpx it also needs come from the integration extras.
    "fastapi>=0.141.1",
]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
bench = [
    "pytest-benchmark>=5.3.0",
    "loguru>=0.7.3",
]
free-threaded = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/structguru-py/Cargo.toml"
module-name = "structguru._rust"
python-source = "src"
# maturin declares `License-File: LICENSE` in the metadata; include the file in
# the sdist too, or PyPI rejects the upload (the wheel already bundles it).
include = ["LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D"]
# The public API reference under docs/api/ is generated entirely from these
# docstrings, so a missing one is an invisible hole in the published docs.
ignore = [
    # Boolean properties read better as "True when ..." than as an imperative.
    "D401",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstrings are enforced on the published surface only; test names carry the
# intent, and examples/scripts are read as whole files rather than via mkdocs.
"tests/**" = ["D"]
"examples/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.*",
    "celery",
    "celery.*",
    "flask",
    "flask.*",
    "sentry_sdk",
    "sentry_sdk.*",
    "grpc",
    "grpc.*",
    "httpx",
    "httpx.*",
    "requests",
    "requests.*",
    "responses",
    "pytest_httpserver",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Benchmarks under tests/benchmarks/ are collected by a plain `pytest` run; without
# this they execute in full (minutes). `make bench` re-enables them explicitly.
addopts = ["--benchmark-disable"]
