name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: CI only needs to read the repo. Release/publish rights live
# solely in wheels.yml. Third-party actions are SHA-pinned (mutable tags/branches
# can be re-pointed by a compromised action repo).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: make install

      - name: Run quality gates
        run: make python-check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace
      # --lib only: the extension-module cdylib cannot link a standalone test
      # binary (no libpython), so lint the library and run core tests separately.
      - name: Clippy
        run: cargo clippy --workspace --lib -- -D warnings
      - name: Core tests
        run: cargo test -p structguru-core

  # Advisories are also re-checked in wheels.yml before a publish, but waiting
  # for release day to learn about a vulnerable dependency is too late — run the
  # same audit on every pull request.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Audit locked Python dependencies
        run: uv audit --locked
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Audit locked Rust dependencies
        run: cargo deny --locked check advisories bans licenses

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@c1709d61444fb708e6ed87924f95626398d8d115 # 1.89.0
        with:
          toolchain: "1.89.0"
      - name: Check on MSRV
        run: cargo check --workspace

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # Smoke-run only: confirm benchmarks execute (native vs baseline). CI is
      # too noisy for a strict perf-regression threshold — track numbers locally.
      - name: Run benchmarks
        run: make install && make bench

  bench-free-threaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14t"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install free-threaded Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install the native benchmark environment
        run: uv sync --locked --python ${{ matrix.python-version }} --no-default-groups --group free-threaded
      - name: Verify the extension keeps free-threaded mode enabled
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python -c
          "import sys, structguru; assert not sys._is_gil_enabled()"
      - name: Run free-threaded correctness and lifecycle tests
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python -m pytest
          tests/test_native_free_threaded.py
          tests/test_native_lifecycle.py::test_disable_during_in_flight_formatting_never_raises
      # Run only the explicitly free-threaded cases. Standard GIL benchmarks
      # remain in the regular benchmark job for an apples-to-apples baseline.
      - name: Run free-threaded concurrency benchmarks
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python -m pytest
          tests/benchmarks/test_bench_native_pipeline.py
          -k free_threaded --benchmark-only
