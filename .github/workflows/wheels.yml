name: Wheels

# Build the binary-wheel matrix (abi3, one wheel per OS/arch) and, on a version
# tag, publish to PyPI via Trusted Publishing (OIDC — no API tokens).
#
# NOTE: publishing requires a PyPI Trusted Publisher configured for this repo +
# a GitHub Environment named "pypi". Until then, tag builds still produce
# artifacts; the publish job is the only step that needs that setup.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.*"
      - "deny.toml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/generate_rust_sbom.py"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check Python, Rust, and tag versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          module = ast.parse(pathlib.Path("src/structguru/__init__.py").read_text())
          python_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          versions = {
              "pyproject.toml": pyproject["project"]["version"],
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "structguru.__version__": python_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          version = next(iter(versions.values()))
          release_tag = os.environ.get("RELEASE_TAG")
          if release_tag and release_tag != f"v{version}":
              raise SystemExit(f"tag {release_tag!r} does not match package version v{version}")
          print(f"validated version {version}")
          PY

  release-python:
    name: release gate Python ${{ matrix.python-version }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PyYAML has no cp315 wheel and its sdist build crashes the runners, so
        # it must stay out of `make install`: it is only pulled by the opt-in
        # docs group, which this gate does not install.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: make install
      - name: Run required source quality gates
        if: matrix.python-version != '3.15'
        run: make python-check

      # mypy 2.4.0's compiled build segfaults under CPython 3.15 on the Linux
      # runners (exit 139 before analysis starts). Type checking is
      # interpreter-independent here; the other release legs run it.
      - name: Run lint and tests without typechecking
        if: matrix.python-version == '3.15'
        run: make lint test

  release-lowest:
    name: release gate lowest direct dependencies
    needs: metadata
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install lowest direct dependencies
        run: uv sync --resolution lowest-direct --all-extras
      - name: Verify installed direct dependency versions
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata
          import re
          import tomllib

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          project = tomllib.load(open("pyproject.toml", "rb"))
          requirements = list(project["project"]["dependencies"])
          for group in project["project"]["optional-dependencies"].values():
              requirements.extend(group)
          for group in ("test", "lint", "bench"):
              requirements.extend(project["dependency-groups"][group])
          direct: dict[str, str] = {}
          for requirement in requirements:
              if not isinstance(requirement, str):
                  continue
              match = re.match(r"^([A-Za-z0-9_.-]+)(?:\[[^]]+\])?\s*>=\s*([^,;\s]+)", requirement)
              if match:
                  direct[canonicalize_name(match.group(1))] = match.group(2)

          def forces_higher(name: str, floor: Version) -> bool:
              """Report whether an installed package requires *name* above *floor*."""
              for dist in importlib.metadata.distributions():
                  if canonicalize_name(dist.metadata["Name"] or "") == name:
                      continue
                  for raw in dist.requires or ():
                      requirement = Requirement(raw)
                      if canonicalize_name(requirement.name) != name:
                          continue
                      if requirement.marker is not None and not requirement.marker.evaluate(
                          {"extra": ""}
                      ):
                          continue
                      for spec in requirement.specifier:
                          if spec.operator in (">=", "==", "~="):
                              try:
                                  if Version(spec.version) > floor:
                                      return True
                              except Exception:  # noqa: BLE001 - unusual test versions
                                  pass
              return False

          for name, minimum in direct.items():
              installed = importlib.metadata.version(name)
              floor = Version(minimum)
              assert Version(installed) >= floor, (
                  f"{name}: expected at least {minimum}, installed {installed}"
              )
              # A shared dependency may force a higher floor than the declared
              # minimum; otherwise lowest-direct must install the minimum.
              assert Version(installed) == floor or forces_higher(name, floor), (
                  f"{name}: expected the lowest compatible version {minimum}, installed {installed}"
              )
          PY
      - name: Run required source quality gates
        run: make python-check

  release-free-threaded:
    name: release gate free-threaded Python ${{ matrix.python-version }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install free-threaded Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked free-threaded environment
        run: uv sync --locked --python ${{ matrix.python-version }} --no-default-groups --group free-threaded
      - name: Verify free-threaded mode remains enabled
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python -c
          "import sys, structguru; assert not sys._is_gil_enabled()"
      - name: Run free-threaded release regressions
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python -m pytest
          tests/test_native_free_threaded.py
          tests/test_native_lifecycle.py::test_disable_during_in_flight_formatting_never_raises

  release-rust:
    name: release gate Rust
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Deny clippy warnings
        run: cargo clippy --workspace --lib -- -D warnings
      - name: Run Rust core tests
        run: cargo test -p structguru-core
      - name: Check the complete workspace
        run: cargo check --workspace

  release-msrv:
    name: release gate Rust 1.89 MSRV
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@c1709d61444fb708e6ed87924f95626398d8d115 # 1.89.0
        with:
          toolchain: "1.89.0"
      - name: Check on MSRV
        run: cargo check --workspace

  supply-chain:
    name: dependency audit and SBOMs
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Audit locked Python dependencies
        run: uv audit --locked
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Audit locked Rust dependencies
        run: cargo deny --locked check advisories bans licenses sources
      - name: Generate CycloneDX SBOMs
        run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms
          path: dist/*.cdx.json

  build:
    name: wheels ${{ matrix.platform.os }}-${{ matrix.platform.target }}
    needs: metadata
    runs-on: ${{ matrix.platform.runner }}
    # A single stuck matrix leg previously blocked the whole release (the
    # publish job needs the entire matrix). Bound each leg so an unavailable
    # runner fails fast instead of hanging the pipeline indefinitely.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,     os: linux,    target: x86_64,  manylinux: auto }
          - { runner: ubuntu-24.04-arm,  os: linux,    target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest,     os: musllinux, target: x86_64,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest,     os: musllinux, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-14,          os: macos,    target: aarch64, manylinux: auto }
          - { runner: macos-15-intel,    os: macos,    target: x86_64,  manylinux: auto }
          - { runner: windows-latest,    os: windows,  target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist/*.whl

  audit-wheels:
    name: audit abi3 wheels from locked environment
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "wheels-{linux,musllinux,macos,windows}-*"
          merge-multiple: true
      - name: Install locked wheel-audit environment
        run: uv sync --locked --no-default-groups --group wheel-audit --no-install-project
      - name: Audit abi3 wheels
        run: uv run --no-sync abi3audit --strict --report dist/*.whl

  runtime-smoke:
    name: runtime wheel ${{ matrix.platform.os }}-${{ matrix.platform.target }}
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    os: linux,     target: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux,     target: aarch64 }
          - { runner: macos-14,         os: macos,     target: aarch64 }
          - { runner: macos-15-intel,   os: macos,     target: x86_64 }
          - { runner: windows-latest,   os: windows,   target: x64 }
          - { runner: ubuntu-latest,    os: musllinux, target: x86_64,  container-platform: linux/amd64 }
          - { runner: ubuntu-latest,    os: musllinux, target: aarch64, container-platform: linux/arm64 }
    env:
      ALPINE_IMAGE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.platform.os != 'musllinux'
        with:
          python-version: "3.11"
      - name: Set up QEMU for aarch64 musl runtime
        if: matrix.platform.os == 'musllinux' && matrix.platform.target == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Smoke-test host-native wheel outside the checkout
        if: matrix.platform.os != 'musllinux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          if [ -x "$RUNNER_TEMP/wheel-smoke/bin/python" ]; then
            py="$RUNNER_TEMP/wheel-smoke/bin/python"
          else
            py="$RUNNER_TEMP/wheel-smoke/Scripts/python.exe"
          fi
          "$py" -m pip install --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -c "import structguru; assert structguru.is_available(); structguru.logger.info('wheel smoke test'); structguru.shutdown()"
      - name: Smoke-test musl wheel in pinned Alpine
        if: matrix.platform.os == 'musllinux'
        run: |
          docker run --rm --platform "${{ matrix.platform.container-platform }}" \
            -v "$PWD/dist:/dist:ro" "$ALPINE_IMAGE" sh -eu -c '
              apk add --no-cache python3 py3-pip
              python3 -m venv /tmp/wheel-smoke
              /tmp/wheel-smoke/bin/pip install --no-index /dist/*.whl
              cd /tmp
              /tmp/wheel-smoke/bin/python -c "import structguru; assert structguru.is_available(); structguru.logger.info(\"musl wheel smoke test\"); structguru.shutdown()"
            '

  build-free-threaded:
    # pip never selects an abi3 wheel on free-threaded CPython (3.14t/3.15t have
    # no stable ABI), so without version-specific wheels a free-threaded install
    # falls back to the sdist and needs a Rust toolchain.
    name: free-threaded wheels ${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.ft-python }}
    needs: metadata
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  os: linux,   target: x86_64,  manylinux: auto, ft-python: "3.14t", ft-linux-interpreter: "/opt/python/cp314-cp314t/bin/python" }
          - { runner: ubuntu-latest,  os: linux,   target: x86_64,  manylinux: auto, ft-python: "3.15t", ft-linux-interpreter: "/opt/python/cp315-cp315t/bin/python" }
          - { runner: macos-14,       os: macos,   target: aarch64, manylinux: auto, ft-python: "3.14t" }
          - { runner: macos-14,       os: macos,   target: aarch64, manylinux: auto, ft-python: "3.15t" }
          - { runner: windows-latest, os: windows, target: x64,     manylinux: auto, ft-python: "3.14t" }
          - { runner: windows-latest, os: windows, target: x64,     manylinux: auto, ft-python: "3.15t" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - name: Install free-threaded Python
        shell: bash
        run: |
          uv python install ${{ matrix.platform.ft-python }}
          echo "FT_PYTHON=$(uv python find ${{ matrix.platform.ft-python }})" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          # Linux builds run inside the manylinux container, which ships its
          # own free-threaded interpreter; macOS and Windows build on the host.
          args: >-
            --release --out dist --interpreter
            ${{ matrix.platform.os == 'linux' && matrix.platform.ft-linux-interpreter || env.FT_PYTHON }}
      - name: Smoke-test free-threaded wheel
        shell: bash
        run: |
          uv venv --python ${{ matrix.platform.ft-python }} ft-venv
          uv pip install --python ft-venv dist/*.whl
          if [ -x ft-venv/bin/python ]; then py=ft-venv/bin/python; else py=ft-venv/Scripts/python.exe; fi
          "$py" -c "import sys, structguru; assert not sys._is_gil_enabled(); assert structguru.is_available(); structguru.logger.info('wheel smoke test'); structguru.shutdown()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-free-threaded-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.ft-python }}
          path: dist/*.whl

  sdist:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - name: Install and smoke-test sdist outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -c "import structguru; assert structguru.is_available(); structguru.logger.info('sdist smoke test'); structguru.shutdown()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [release-python, release-lowest, release-free-threaded, release-rust, release-msrv, build, audit-wheels, runtime-smoke, build-free-threaded, sdist, supply-chain]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          # Only publish the wheel/sdist artifacts this workflow built; never
          # pick up an unrelated artifact that some other job might upload.
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          # Skip files already on PyPI so a re-run after a partial upload
          # completes the missing artifacts instead of failing on the wheels
          # that landed first.
          skip-existing: true
          # PEP 740 attestations are generated automatically.

  github-release:
    name: Attach SBOMs to the GitHub Release
    # `publish` already waits for the release gates and the wheel builds.
    # An `if` replaces the implicit success() check, so a failed or skipped
    # publish must be excluded explicitly or this job still creates the release.
    needs: [publish, supply-chain]
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' && needs.supply-chain.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sboms
          path: dist
      - name: Publish release with SBOMs
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.cdx.json
