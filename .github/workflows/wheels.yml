name: Wheels

# Build the binary-wheel matrix (abi3, one wheel per OS/arch) and, on a version
# tag, publish to PyPI via Trusted Publishing (OIDC — no API tokens).
#
# NOTE: publishing requires a PyPI Trusted Publisher configured for this repo +
# a GitHub Environment named "pypi". Until then, tag builds still produce
# artifacts; the publish job is the only step that needs that setup.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check Python, Rust, and tag versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          module = ast.parse(pathlib.Path("src/structguru/__init__.py").read_text())
          python_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          versions = {
              "pyproject.toml": pyproject["project"]["version"],
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "structguru.__version__": python_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          version = next(iter(versions.values()))
          release_tag = os.environ.get("RELEASE_TAG")
          if release_tag and release_tag != f"v{version}":
              raise SystemExit(f"tag {release_tag!r} does not match package version v{version}")
          print(f"validated version {version}")
          PY

  release-python:
    name: release gate Python ${{ matrix.python-version }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: make install
      - name: Run required source quality gates
        run: make python-check

  release-free-threaded:
    name: release gate free-threaded Python 3.14
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install free-threaded Python
        run: uv python install 3.14t
      - name: Install locked free-threaded environment
        run: uv sync --locked --python 3.14t --no-default-groups --group free-threaded
      - name: Verify free-threaded mode remains enabled
        run: >-
          uv run --no-sync --python 3.14t python -c
          "import sys, structguru; assert not sys._is_gil_enabled()"
      - name: Run free-threaded release regressions
        run: >-
          uv run --no-sync --python 3.14t python -m pytest
          tests/test_native_free_threaded.py
          tests/test_native_lifecycle.py::test_disable_during_in_flight_formatting_never_raises

  release-rust:
    name: release gate Rust
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Deny clippy warnings
        run: cargo clippy --workspace --lib -- -D warnings
      - name: Run Rust core tests
        run: cargo test -p structguru-core
      - name: Check the complete workspace
        run: cargo check --workspace

  supply-chain:
    name: dependency audit and SBOMs
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Audit locked Python dependencies
        run: uv audit --locked
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Audit locked Rust dependencies
        run: cargo deny --locked check advisories
      - name: Generate CycloneDX SBOMs
        run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms
          path: dist/*.cdx.json

  build:
    name: wheels ${{ matrix.platform.os }}-${{ matrix.platform.target }}
    needs: metadata
    runs-on: ${{ matrix.platform.runner }}
    # A single stuck matrix leg previously blocked the whole release (the
    # publish job needs the entire matrix). Bound each leg so an unavailable
    # runner fails fast instead of hanging the pipeline indefinitely.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  os: linux,   target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  os: linux,   target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest,  os: musllinux, target: x86_64,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest,  os: musllinux, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-14,       os: macos,   target: aarch64, manylinux: auto }
          # Intel-mac wheel is cross-compiled on the arm64 runner: the standard
          # macos-13 (x86_64) image is no longer reliably provisioned, and
          # x86_64-apple-darwin is a tier-1 Rust target, so maturin cross-builds
          # it cleanly. (This leg is not smoke-tested — the wheel's arch differs
          # from the host; abi3audit still validates it below.)
          - { runner: macos-14,       os: macos,   target: x86_64,  manylinux: auto }
          - { runner: windows-latest, os: windows, target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      - name: Audit abi3 wheels
        shell: bash
        run: |
          pip install abi3audit==0.0.26
          # shell: bash ensures dist/*.whl expands consistently on every runner
          # (Windows defaults to PowerShell, where the glob behaves differently).
          abi3audit --strict --report dist/*.whl
      - name: Smoke-test host-native wheel
        # Only import-test wheels whose arch matches the runner. The Intel-mac
        # wheel is cross-compiled on the arm64 runner, so skip it here.
        if: >-
          (matrix.platform.os == 'linux' && matrix.platform.target == 'x86_64') ||
          (matrix.platform.os == 'macos' && matrix.platform.target == 'aarch64') ||
          matrix.platform.os == 'windows'
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import structguru; assert structguru.native_available(); structguru.logger.info('wheel smoke test'); structguru.disable_native()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist/*.whl

  sdist:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [release-python, release-free-threaded, release-rust, build, sdist, supply-chain]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          # Only publish the wheel/sdist artifacts this workflow built; never
          # pick up an unrelated artifact that some other job might upload.
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          # Skip files already on PyPI so a re-run after a partial upload
          # completes the missing artifacts instead of failing on the wheels
          # that landed first.
          skip-existing: true
          # PEP 740 attestations are generated automatically.
