[workspace]
members = [
    "crates/structguru-core",
    "crates/structguru-py",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Aleksandr Pavlov <ckidoz@gmail.com>"]
repository = "https://github.com/kidoz/structguru"

[profile.release]
# Optimize the shipped extension: whole-program LTO + single codegen unit for
# speed, strip symbols to shrink the wheel. Keep the default unwind panic
# strategy — PyO3's FFI trampoline relies on catch_unwind.
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
pyo3 = { version = "0.29.0" }
serde = { version = "1.0" }
serde_json = { version = "1.0", features = ["raw_value"] }
time = { version = "0.3", features = ["macros", "formatting"] }
# `unicode` is on by default in the regex crate; keep it so character classes
# match Python's `re` defaults (which are Unicode-aware on `str`).
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
rand = { version = "0.9", default-features = false, features = [
    "std",
    "std_rng",
    "alloc",
    "small_rng",
    "os_rng",
    "thread_rng",
] }
structguru-core = { path = "crates/structguru-core" }
